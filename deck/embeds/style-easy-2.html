<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Easy read: this week</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#00352B}
p,ol,ul{margin:0;padding:0;list-style:none}
.card{height:100%;background:#FFFFFD;border-radius:32px;padding:28px;display:flex;flex-direction:column;gap:20px;box-shadow:inset 0 0 0 2px #E6E2D8}
.h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.t{font-size:32px;line-height:1.2;font-weight:500}
.side{font-size:26px;line-height:1.3;color:#36544C}
.lead{display:flex;flex-direction:column;gap:14px}
.big{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
.n{font-size:88px;line-height:1;font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.unit{font-size:28px;line-height:1.3}
.ans{font-size:34px;line-height:1.25}
.dot{display:inline-block;vertical-align:.06em;width:22px;height:22px;margin-right:16px;border-radius:50%;background:#C2A64B;box-shadow:inset 0 0 0 2px #695612}
.row{display:grid;grid-template-columns:repeat(7,1fr)}
.day{display:flex;flex-direction:column;align-items:center;gap:10px}
.k,.now{font-size:24px;line-height:1.2;font-weight:500;white-space:nowrap}
.c{display:grid;place-items:center;width:60px;height:60px;border-radius:50%;font-size:26px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.is-usual{background:#4F2641;color:#F9F7F2}
.is-shift{background:#C2A64B;color:#00352B;box-shadow:inset 0 0 0 2px #695612}
.is-none{box-shadow:inset 0 0 0 2px #6A837C}
.gr{display:flex;flex-direction:column;gap:12px}
.gr li{display:flex;align-items:flex-start;gap:14px;font-size:24px;line-height:1.35}
.gr .c{width:30px;height:30px;margin-top:1px}
.gr b{font-weight:500}
.go .card>*{animation:rise .45s cubic-bezier(.2,.7,.1,1) both}
.go .card>:nth-child(2){animation-delay:60ms}
.go .card>:nth-child(3){animation-delay:120ms}
.go .card>:nth-child(4){animation-delay:180ms}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Easy read look, this week: 4 of 6 days within your usual. Seven day circles, Monday 5 to today the 11th: within your usual on Monday, Tuesday, Saturday and today, outside your usual on Wednesday and Friday, Thursday not logged">
  <div class="h"><p class="t">This week</p><p class="side">Oct 5 to today</p></div>
  <div class="lead">
    <p class="big"><b class="n">4</b><span class="unit">of 6 days within your usual</span></p>
    <p class="ans"><i class="dot" aria-hidden="true"></i>Outside your usual on Wednesday and Friday.</p>
  </div>
  <ol class="row" id="row" aria-hidden="true"></ol>
  <ul class="gr" aria-hidden="true">
    <li><i class="c is-usual"></i><span><b>Within your usual:</b> Mon, Tue, Sat and today</span></li>
    <li><i class="c is-shift"></i><span><b>Outside your usual:</b> Wed and Fri</span></li>
    <li><i class="c is-none"></i><span><b>Not logged:</b> Thu</span></li>
  </ul>
</div>
<script>
/* Sarah's week (C, 12 weeks, every meal), from FLD.build, days[7]: Oct 5 to 11. Wednesday's first BM came at 8:55 AM,
   after her usual 7:15 to 8:45 AM; on Friday one BM was firmer than her usual forms; Thursday has no logs */
var W=[['Mon',5,'usual'],['Tue',6,'usual'],['Wed',7,'shift'],['Thu',8,'none'],['Fri',9,'shift'],['Sat',10,'usual'],['Sun',11,'usual',1]],h='';
W.forEach(function(d){h+='<li class="day"><span class="k">'+d[0]+'</span><span class="c is-'+d[2]+'">'+d[1]+'</span>'+(d[3]?'<span class="now">Today</span>':'')+'</li>'});
document.getElementById('row').innerHTML=h;
var B=document.body,Rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(Rm)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
