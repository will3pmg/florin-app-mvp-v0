<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Easy read: your last 7 days</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#00352B}
.card{height:100%;background:#FFFFFD;border-radius:32px;padding:26px 28px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 2px #E6E2D8}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top b{font-size:32px;font-weight:500}.top span{font-size:24px;color:#36544C}
.big{display:flex;align-items:baseline;gap:14px;font-size:26px}
.big b{font-size:84px;font-weight:300;line-height:.95}
.wk{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;justify-items:center;margin:4px 0 0}
.w{font-size:24px;font-weight:500}
.c{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:500}
.u{background:#4F2641;color:#F9F7F2}
.s{background:#C2A64B;box-shadow:inset 0 0 0 2px #695612;color:#00352B}
.x{color:#36544C;font-weight:400}
.t{box-shadow:0 0 0 3px #FFFFFD,0 0 0 6px #00352B}
.q{width:16px;height:16px;border-radius:2px}
.q.on{background:#396E7C}
.tl{font-size:24px;font-weight:500;grid-column:7}
ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;gap:14px;font-size:24px;line-height:1.25}
li i{flex:none;width:20px;height:20px;margin-top:5px}
.kg{border-radius:50%;background:#C2A64B;box-shadow:inset 0 0 0 2px #695612}
.ks{border-radius:2px;background:#396E7C;width:18px!important;height:18px!important}
.go .c{animation:pop .4s cubic-bezier(.3,1.5,.5,1) both}
.go li{animation:rise .5s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Easy read look: your last 7 days, Oct 5 to 11. 4 of 6 days within your usual. Wednesday and Friday were outside it, nothing was logged on Thursday, and symptoms came up on 2 days">
  <div class="top"><b>Your last 7 days</b><span>Oct 5 to 11</span></div>
  <div class="big"><b>4</b><span>of 6 days within your usual</span></div>
  <div class="wk" id="wk"></div>
  <ul id="ln"></ul>
</div>
<script>
/* Sarah's last 7 days (C, 12 weeks, every meal) from L.span(7), L.tally, L.dayWhy and L.symLine: each day's mark,
   symptoms on Wednesday and today, and the lines the Easy version writes under the days */
var D=[['Mon',5,'u',0],['Tue',6,'u',0],['Wed',7,'s',1],['Thu',8,'x',0],['Fri',9,'s',0],['Sat',10,'u',0],['Sun',11,'u',1]],h='';
D.forEach(function(d){h+='<span class="w">'+d[0]+'</span>'});
D.forEach(function(d,i){h+='<span class="c '+d[2]+(i===6?' t':'')+'" style="animation-delay:'+(i*.08).toFixed(2)+'s">'+d[1]+'</span>'});
D.forEach(function(d){h+='<span class="q'+(d[3]?' on':'')+'"></span>'});
h+='<span class="tl">Today</span>';
document.getElementById('wk').innerHTML=h;
var L=[['kg','Wednesday: your first BM came later than usual, at 8:55 AM.'],['kg','Friday: one BM was Firm, firmer than your usual forms.'],['','Nothing logged on Thursday.'],['ks','Symptoms on 2 days: mild bloating both days.']];
document.getElementById('ln').innerHTML=L.map(function(l,i){return'<li style="animation-delay:'+(.7+i*.12).toFixed(2)+'s"><i class="'+l[0]+'"></i><span>'+l[1]+'</span></li>'}).join('');
var B=document.body,R=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(R)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
