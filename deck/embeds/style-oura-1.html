<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Oura: FloraScore arc gauge</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#F9F7F2}
.card{height:100%;border-radius:32px;padding:28px;display:flex;flex-direction:column;gap:16px;overflow:hidden;background-color:#00221A;
 background-image:radial-gradient(70% 18% at 24% 52%,rgba(57,109,124,.46),rgba(57,109,124,0) 100%),radial-gradient(60% 16% at 86% 52%,rgba(78,38,66,.7),rgba(78,38,66,0) 100%),radial-gradient(140% 44% at 50% 52%,rgba(56,111,123,.48),rgba(56,111,123,0) 72%),radial-gradient(70% 46% at 100% 0%,rgba(79,38,65,.85),rgba(79,38,65,0) 70%),radial-gradient(60% 40% at 0% 6%,rgba(57,110,124,.42),rgba(57,110,124,0) 72%),radial-gradient(64% 34% at 50% 34%,rgba(56,109,123,.3),rgba(56,109,123,0) 100%),linear-gradient(180deg,#001A14,#00221A 40%,#0A3540 100%)}
.h{display:flex;justify-content:space-between;align-items:center;font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;color:rgba(249,247,242,.78)}
.h .k{text-transform:uppercase;letter-spacing:.08em}
.h .d{letter-spacing:.04em}
.g{position:relative;flex:none}
.g::before{content:"";position:absolute;inset:0;background:radial-gradient(50% 46% at 50% 56%,rgba(56,109,123,.3),rgba(56,109,123,0) 100%)}
.g svg{position:relative;display:block;overflow:visible}
svg text{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px}
.trk{fill:none;stroke:rgba(249,249,243,.16);stroke-width:6;stroke-linecap:round}
.bd{fill:none;stroke:rgba(239,255,162,.55);stroke-width:18;stroke-linecap:round}
.arc{fill:none;stroke:#F9F7F2;stroke-width:6;stroke-linecap:round}
.dot{fill:#DFC678;stroke:#00221A;stroke-width:4}
.end{fill:rgba(249,247,242,.78)}
.ue{fill:#EEFFA3;font-weight:700}
.c{position:absolute;left:0;right:0;top:57.3%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.n{font-size:104px;line-height:.92;font-weight:300;letter-spacing:-.055em;font-variant-numeric:tabular-nums;margin-right:6px}
.st{max-width:270px;font:24px/1.25 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:#F1DA93;text-wrap:balance}
.hl{margin:0;font:400 30px/1.2 Georgia,"Times New Roman",serif;letter-spacing:-.005em;text-align:center;text-wrap:balance}
.how{margin:0;font-size:24px;line-height:1.35;text-align:center;color:rgba(249,247,242,.78);text-wrap:pretty}
.go .card{animation:in .6s cubic-bezier(.2,.7,.1,1) both}
.go .sw{stroke-dasharray:1;animation:sweep 1.1s .15s cubic-bezier(.2,.7,.1,1) both}
.go .bd{animation-duration:.7s;animation-delay:80ms}
.go .arc{animation-duration:1.5s}
.go .ue{animation:fade .6s .2s cubic-bezier(.2,.7,.1,1) both}
.go .dot{transform-box:fill-box;transform-origin:center;animation:pop .5s 1.1s cubic-bezier(.2,.7,.1,1) both}
.go .c{animation:fade .7s .3s cubic-bezier(.2,.7,.1,1) both}
.go .st{animation:fade .5s 1.2s cubic-bezier(.2,.7,.1,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@keyframes sweep{0%{stroke-dashoffset:1;opacity:0}8%{opacity:1}100%{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Oura look: FloraScore 83 on an open arc gauge over a Forest glow, the usual range of 74 to 82 drawn on its track, and the state word A little above your usual">
  <div class="h"><span class="k">FloraScore</span><span class="d">Sunday, October 11</span></div>
  <div class="g">
    <svg id="ch" width="480" height="262" viewBox="0 0 480 262" aria-hidden="true">
      <path id="trk" class="trk"/>
      <path id="bd" class="bd sw" pathLength="1"/>
      <path id="arc" class="arc sw" pathLength="1"/>
      <circle id="dot" class="dot" r="10"/>
    </svg>
    <div class="c" aria-hidden="true"><b class="n" data-n="83">83</b><span class="st">A little above your usual</span></div>
  </div>
  <p class="hl">Your morning landed in your usual window, in a form within your usual</p>
  <p class="how">FloraScore blends your last 3 days that have logs and compares you with you. It isn’t a medical score, and a lower number isn’t a diagnosis.</p>
</div>
<script>
/* Sarah today (C, 12 weeks, every meal), from FLD.build: FloraScore 83, usual range 74 to 82, "A little above your usual
   range"; the headline is look-oura's bigThing for today. The gauge is the look's own: 252 degrees, open at the bottom */
var V=83,U=[74,82],cx=240,cy=146,R=135,A0=-.35,A1=.35,ns='http://www.w3.org/2000/svg',ch=document.getElementById('ch');
var fv=function(v){return A0+(A1-A0)*v/100},pol=function(r,f){return[(cx+r*Math.sin(f*2*Math.PI)).toFixed(1),(cy-r*Math.cos(f*2*Math.PI)).toFixed(1)]};
function arc(a,b){var p=pol(R,a),q=pol(R,b);return'M'+p+'A'+R+','+R+' 0 '+(b-a>.5?1:0)+' 1 '+q}
document.getElementById('trk').setAttribute('d',arc(A0,A1));
document.getElementById('bd').setAttribute('d',arc(fv(U[0]),fv(U[1])));
document.getElementById('arc').setAttribute('d',arc(A0,fv(V)));
var m=pol(R,fv(V)),dot=document.getElementById('dot');dot.setAttribute('cx',m[0]);dot.setAttribute('cy',m[1]);
function tx(x,y,t,c){var e=document.createElementNS(ns,'text');e.setAttribute('x',x);e.setAttribute('y',y);e.setAttribute('text-anchor','middle');e.setAttribute('class',c);e.textContent=t;ch.insertBefore(e,dot)}
[[A0,'0'],[A1,'100']].forEach(function(e){var p=pol(R,e[0]);tx(p[0],+p[1]+32,e[1],'end')});
U.forEach(function(u){var p=pol(R+30,fv(u));tx(p[0],+p[1]+8,u,'ue')});
var B=document.body,Rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function count(){document.querySelectorAll('[data-n]').forEach(function(e){var n=+e.getAttribute('data-n'),t0=performance.now();e.textContent='0';(function f(t){var k=Math.min(1,(t-t0)/1300);e.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
function play(){if(Rm)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go');count()}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
