<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Oura: FloraScore gauge</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#F9F7F2}
.card{height:100%;border-radius:32px;padding:22px 28px;display:flex;flex-direction:column;align-items:center;gap:8px;
 background:radial-gradient(70% 24% at 24% 46%,rgba(57,110,124,.46),rgba(57,110,124,0) 100%),radial-gradient(60% 22% at 86% 40%,rgba(79,38,65,.42),rgba(79,38,65,0) 100%),radial-gradient(120% 60% at 50% 0%,#0A3A30,rgba(0,34,26,0) 70%),#00221A}
.top{align-self:stretch;display:flex;justify-content:space-between;font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#C2C8C2}
.top b{font-weight:400;letter-spacing:1px}
.parts{align-self:stretch;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:24px;line-height:1.2;color:#C2C8C2}
.parts div{display:flex;flex-direction:column;align-items:center;gap:4px}
svg text{font-family:ui-monospace,Menlo,Consolas,monospace}
.hl{margin:0;text-align:center;font:400 28px/1.22 Georgia,"Times New Roman",serif}
.how{margin:0;text-align:center;font-size:24px;line-height:1.28;color:#C2C8C2}
.go .sw{animation:sweep 1.4s .2s cubic-bezier(.3,.7,.2,1) both}
.go .pr{animation:sweep .9s cubic-bezier(.3,.7,.2,1) both}
.go .bd{animation:fade .6s .9s ease-out both}
.go .dt{animation:pop .45s 1.5s cubic-bezier(.3,1.5,.5,1) both}
.go .hl,.go .how{animation:fade .6s 1.6s ease-out both}
.dt{transform-box:fill-box;transform-origin:center}
@keyframes sweep{from{stroke-dashoffset:1}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Oura look: FloraScore 83 on a round gauge from 0 to 100, a little above its usual range of 74 to 82, with a small ring for each part of the score: Timing, How often, Form and Comfort">
  <div class="top"><b>FLORASCORE</b><span>Sunday, October 11</span></div>
  <div class="parts" id="parts"></div>
  <svg id="g" viewBox="0 0 472 236" width="472" height="236" style="flex:none" aria-hidden="true"></svg>
  <p class="hl">Your morning landed in your usual window, in a form within your usual</p>
  <p class="how">FloraScore blends the days among your last 3 that have a BM, or No BM, logged, and compares you with you. It isn’t a medical score, and a lower number isn’t a diagnosis.</p>
</div>
<script>
/* Sarah today (C, 12 weeks, every meal): FloraScore 83, usual range 74 to 82 (L.score, L.scoreUsual). The four part
   rings show today's parts out of 100, each within its own usual: Timing 97, How often 97, Form 92, Comfort 92 */
var ns='http://www.w3.org/2000/svg',P=[['Timing',97],['How often',97],['Form',92],['Comfort',92]],h='';
P.forEach(function(p,i){var a=p[1]/100*2*Math.PI,ex=(26+20*Math.sin(a)).toFixed(1),ey=(26-20*Math.cos(a)).toFixed(1);
 h+='<div><svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="20" fill="none" stroke="#28443D" stroke-width="5"/><path class="pr" style="animation-delay:'+(i*.12).toFixed(2)+'s" d="M26,6A20,20 0 1 1 '+ex+','+ey+'" fill="none" stroke="#EEFFA3" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"/></svg><span>'+p[0]+'</span></div>'});
document.getElementById('parts').innerHTML=h;
var g=document.getElementById('g'),cx=236,cy=126,R=118;
function el(t,a,txt){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;g.appendChild(e);return e}
function pt(f,r){var a=(-126+f*252)*Math.PI/180;return[(cx+r*Math.sin(a)).toFixed(1),(cy-r*Math.cos(a)).toFixed(1)]}
function arc(f0,f1,r){return'M'+pt(f0,r)+'A'+r+','+r+' 0 '+((f1-f0)*252>180?1:0)+' 1 '+pt(f1,r)}
el('path',{d:arc(0,1,R),fill:'none',stroke:'#28443D','stroke-width':6,'stroke-linecap':'round'});
el('path',{d:arc(.74,.82,R),fill:'none',stroke:'#839C65','stroke-width':14,'stroke-linecap':'round','class':'bd'});
el('path',{d:arc(0,.83,R),fill:'none',stroke:'#F9F7F2','stroke-width':6,'stroke-linecap':'round',pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':0,'class':'sw'});
var e0=pt(0,R),e1=pt(1,R);
el('text',{x:e0[0],y:+e0[1]+34,'text-anchor':'middle','font-size':24,fill:'#909E97'},'0');el('text',{x:e1[0],y:+e1[1]+34,'text-anchor':'middle','font-size':24,fill:'#909E97'},'100');
var l1=pt(.74,R+26),l2=pt(.82,R+28);
el('text',{x:l1[0],y:+l1[1]+4,'text-anchor':'start','font-size':24,fill:'#EEFFA3','class':'bd'},'74');el('text',{x:l2[0],y:+l2[1]+12,'text-anchor':'start','font-size':24,fill:'#EEFFA3','class':'bd'},'82');
var d=pt(.83,R);el('circle',{cx:d[0],cy:d[1],r:10,fill:'#DFC678',stroke:'#00221A','stroke-width':4,'class':'dt'});
el('text',{x:cx,y:cy-4,'text-anchor':'middle',style:'font:300 88px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#F9F7F2'},'83');
el('text',{x:cx,y:cy+28,'text-anchor':'middle','font-size':24,fill:'#F1DA93'},'A LITTLE ABOVE');
el('text',{x:cx,y:cy+56,'text-anchor':'middle','font-size':24,fill:'#F1DA93'},'ITS USUAL');
var B=document.body,Rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(Rm)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
