<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Florin charts: the week card</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#00352B}
.card{height:100%;background:#FFFFFD;border-radius:32px;padding:32px 24px;display:flex;flex-direction:column;gap:20px;box-shadow:inset 0 0 0 2px #E6E2D8}
.k{margin:0 0 0 4px;font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;color:#36544C;text-transform:uppercase}
.lead{display:flex;align-items:baseline;gap:12px;margin:0 4px}
.lead b{font-size:84px;line-height:.95;font-weight:400;letter-spacing:-2px}
.lead span{font-size:26px;line-height:1.2;color:#36544C}
.ans{margin:0 4px;font:28px/1.3 Georgia,"Times New Roman",serif;color:#00352B}
ol{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(7,1fr)}
li{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0 12px;border-radius:20px}
li.t{background:#F1EEE6}
.w{font-size:24px;line-height:1.2;color:#36544C;white-space:nowrap}
li.t .w{color:#00352B;font-weight:700}
.r{position:relative;width:60px;height:60px}
.r svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.r b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:500}
li.x .r b{color:#36544C;font-weight:400}
.s{display:flex;align-items:center;height:30px;font:24px/1 ui-monospace,Menlo,Consolas,monospace;color:#36544C}
.add{display:inline-flex;align-items:center;gap:3px;height:30px;padding:0 7px;border-radius:999px;box-shadow:inset 0 0 0 1.5px #5D766F;font:700 24px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#00352B;white-space:nowrap}
.add svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.q{width:14px;height:14px;border-radius:3px}
.q.on{background:#396E7C}
ul{list-style:none;margin:2px 4px 0;padding:0;display:flex;flex-wrap:wrap;gap:12px 40px}
ul li{flex-direction:row;gap:12px;padding:0;font-size:24px;line-height:1.2;color:#36544C;white-space:nowrap}
ul i{flex:none;width:24px;height:24px;border-radius:50%}
.iu{box-shadow:inset 0 0 0 4px #4F2641}
.is{background:#F0EAD4;box-shadow:inset 0 0 0 4px #C2A64B,0 0 0 1.5px #695612}
.ig{box-shadow:inset 0 0 0 2px #5D766F}
.iq{width:14px!important;height:14px!important;margin:0 5px;border-radius:3px!important;background:#396E7C}
.go .r{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.go .s,.go .q,.go .lead,.go .ans{animation:rise .5s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Florin charts, Today's week card, the Rings week you picked: This week, 4 of 6 days within your usual, outside your usual on Wednesday and Friday. A ring a day with that day's FloraScore under it: Plum within the usual, Gold outside it, Thursday an empty ring with Add for a day with nothing logged, today's column shaded, and a Teal square on the 2 days with symptoms">
  <p class="k">This week</p>
  <p class="lead"><b>4</b><span>of 6 days within your usual</span></p>
  <p class="ans" style="animation-delay:.15s">Outside your usual on Wednesday and Friday.</p>
  <ol id="wk"></ol>
  <ul>
    <li><i class="iu"></i>Within your usual</li>
    <li><i class="is"></i>Outside your usual</li>
    <li><i class="ig"></i>Nothing logged</li>
    <li><i class="iq"></i>Symptoms</li>
  </ul>
</div>
<script>
/* Sarah (C, 12 weeks, every meal), Today's week card as RU.weekCard draws it on Oct 11 since Nov 4: the Rings week Will
   picked. The answer is D.tally[7] (4 within of 6 read), each day its ring (u within, s outside, x nothing logged, so
   Add), the number under a ring that day's L.score, a Teal square on each day with a symptom (Wed and today, mild
   bloating), and today's column shaded */
var D=[['Mon',5,'u',85,0],['Tue',6,'u',86,0],['Wed',7,'s',83,1],['Thu',8,'x',null,0],['Fri',9,'s',78,0],['Sat',10,'u',83,0],['Today',11,'u',83,1]];
var C=30,R=25.5;
function ring(k){
  if(k==='x')return'<circle cx="'+C+'" cy="'+C+'" r="'+R+'" fill="none" stroke="#5D766F" stroke-width="2"/>';
  if(k==='s')return'<circle cx="'+C+'" cy="'+C+'" r="'+R+'" fill="#F0EAD4"/><circle cx="'+C+'" cy="'+C+'" r="'+R+'" fill="none" stroke="#C2A64B" stroke-width="6"/><circle cx="'+C+'" cy="'+C+'" r="'+(R+3.4)+'" fill="none" stroke="#695612" stroke-width="2"/>';
  return'<circle cx="'+C+'" cy="'+C+'" r="'+R+'" fill="none" stroke="#4F2641" stroke-width="6"/>';
}
var ADD='<span class="add"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9"/></svg>Add</span>';
document.getElementById('wk').innerHTML=D.map(function(d,i){
  var t=i===6,x=d[2]==='x',dl=(.3+i*.08).toFixed(2);
  return'<li class="'+(t?'t ':'')+(x?'x':'')+'"><span class="w">'+d[0]+'</span><span class="r" style="animation-delay:'+dl+'s"><svg viewBox="0 0 60 60" aria-hidden="true">'+ring(d[2])+'</svg><b>'+d[1]+'</b></span><span class="s" style="animation-delay:'+(+dl+.25).toFixed(2)+'s">'+(x?ADD:d[3])+'</span><span class="q'+(d[4]?' on':'')+'" style="animation-delay:'+(+dl+.35).toFixed(2)+'s"></span></li>';
}).join('');
var B=document.body,Rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(Rm)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
