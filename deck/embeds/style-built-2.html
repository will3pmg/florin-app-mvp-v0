<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Florin charts: the week card</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#00352B}
.card{height:100%;background:#FFFFFD;border-radius:32px;padding:28px 28px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 2px #E6E2D8}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top b{font-size:30px;font-weight:500}
.k{font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;color:#36544C;text-transform:uppercase}
.a{display:flex;align-items:center;gap:12px;margin:4px 0;font-size:29px;line-height:1.15;font-weight:500;white-space:nowrap}
.a i{flex:none;width:20px;height:20px;border-radius:50%;background:#4F2641}
.wk{display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px;justify-items:center}
.w{font:24px/1 ui-monospace,Menlo,Consolas,monospace;color:#5D766F}
.c{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:500}
.u{background:#4F2641;color:#F9F7F2}
.s{background:#C2A64B;box-shadow:inset 0 0 0 2px #695612;color:#00352B}
.x{color:#5D766F;font-weight:400}
.t{box-shadow:0 0 0 3px #FFFFFD,0 0 0 6px #00352B}
.q{width:14px;height:14px;border-radius:2px}
.q.on{background:#396E7C}
.tl{font-size:24px;font-weight:500;grid-column:7;margin-top:-4px}
hr{width:100%;margin:2px 0;border:0;border-top:2px solid #E6E2D8}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{display:flex;gap:14px;font-size:24px;line-height:1.25;color:#36544C}
li i{flex:none;width:20px;height:20px;margin-top:4px}
.kg{border-radius:50%;background:#C2A64B;box-shadow:inset 0 0 0 2px #695612}
.ks{border-radius:2px;background:#396E7C;width:16px!important;height:16px!important;margin:6px 2px 0}
.go .c{animation:pop .4s cubic-bezier(.3,1.5,.5,1) both}
.go .a,.go li{animation:rise .5s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Florin charts, Today's week card: your last 7 days, Oct 5 to 11. 4 of 6 days within your usual, one circle a day: Plum within, Gold outside, Thursday's date alone with nothing logged, today ringed, and a Teal square on the 2 days with symptoms. A line names each day that wasn't within the usual">
  <div class="top"><b>Your last 7 days</b><span class="k">Oct 5 to 11</span></div>
  <p class="a" style="animation-delay:.1s"><i></i>4 of 6 days within your usual</p>
  <div class="wk" id="wk"></div>
  <hr>
  <ul id="ln"></ul>
</div>
<script>
/* Sarah (C, 12 weeks, every meal), Today's week card as RU.weekCard draws it on Oct 11: the answer is L.tally over the
   last 7 days (4 within of 6 read), each day its mark (u within, s outside, x nothing logged), today ringed, a Teal square
   on each day with a symptom (Wed and Sun, mild bloating), and the lines from L.dayWhy and L.symLine */
var D=[['Mon',5,'u',0],['Tue',6,'u',0],['Wed',7,'s',1],['Thu',8,'x',0],['Fri',9,'s',0],['Sat',10,'u',0],['Sun',11,'u t',1]];
var L=[['kg','Wednesday: your first BM came later than usual, at 8:55 AM.'],['kg','Friday: one BM was Firm, firmer than your usual forms.'],['','Nothing logged on Thursday.'],['ks','Symptoms on 2 days: mild bloating both days.']];
var h='';
D.forEach(function(d){h+='<span class="w">'+d[0]+'</span>'});
D.forEach(function(d,i){h+='<span class="c '+d[2]+'" style="animation-delay:'+(.3+i*.08).toFixed(2)+'s">'+d[1]+'</span>'});
D.forEach(function(d){h+='<span class="q'+(d[3]?' on':'')+'"></span>'});
h+='<span class="tl">Today</span>';
document.getElementById('wk').innerHTML=h;
document.getElementById('ln').innerHTML=L.map(function(l,i){return'<li style="animation-delay:'+(1+i*.12).toFixed(2)+'s"><i class="'+l[0]+'"></i><span>'+l[1]+'</span></li>'}).join('');
var B=document.body,R=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(R)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
