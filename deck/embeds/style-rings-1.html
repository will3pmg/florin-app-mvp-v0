<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rings: FloraScore hero</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#F9F7F2}
.card{height:100%;border-radius:32px;padding:32px;display:flex;flex-direction:column;gap:18px;background:radial-gradient(120% 90% at 30% 20%,#0E4A3D 0%,#00352B 60%,#002A22 100%)}
.top{display:flex;justify-content:space-between;font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;text-transform:uppercase;color:#BFD3CC}
svg text{font-family:ui-monospace,Menlo,Consolas,monospace}
.st{display:flex;align-items:center;gap:16px;font:400 34px/1.2 Georgia,"Times New Roman",serif}
.st i{width:18px;height:18px;border-radius:50%;background:#DCC374;flex:none}
p{margin:0;font-size:24px;line-height:1.35;color:#BFD3CC}
.go .ring{animation:sweep 1.4s cubic-bezier(.3,.7,.2,1) both}
.go .band{animation:band .7s 1.1s ease-out both}
.go .mk{animation:pop .45s 1.35s cubic-bezier(.3,1.5,.5,1) both}
.go .st,.go p{animation:rise .6s 1.5s ease-out both}
.mk{transform-box:fill-box;transform-origin:center}
@keyframes sweep{from{stroke-dasharray:0 100}}
@keyframes band{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Rings look: FloraScore 83 today on a Ray ring, the usual range of 74 to 82 drawn on its outer track">
  <div class="top"><span>FloraScore</span><span>Sunday, October 11</span></div>
  <svg viewBox="0 0 472 336" width="100%" height="336" style="flex:none" aria-hidden="true">
    <circle cx="236" cy="168" r="158" fill="none" stroke="#F9F7F2" stroke-opacity=".1" stroke-width="2"/>
    <circle cx="236" cy="168" r="128" fill="none" stroke="#F9F7F2" stroke-opacity=".08" stroke-width="26"/>
    <circle id="band" class="band" cx="236" cy="168" r="158" fill="none" stroke="#EEFFA3" stroke-opacity=".55" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="8 92" stroke-dashoffset="-74" transform="rotate(-90 236 168)"/>
    <circle class="ring" cx="236" cy="168" r="128" fill="none" stroke="#EEFFA3" stroke-width="26" stroke-linecap="round" pathLength="100" stroke-dasharray="83 100" transform="rotate(-90 236 168)"/>
    <circle id="mk" class="mk" r="14" fill="#DCC374" stroke="#00352B" stroke-width="5"/>
    <text x="236" y="112" text-anchor="middle" font-size="24" fill="#BFD3CC" letter-spacing="2">TODAY</text>
    <text x="236" y="196" text-anchor="middle" font-size="96" font-weight="300" fill="#F9F7F2" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" data-n="83">83</text>
    <text x="236" y="228" text-anchor="middle" font-size="24" fill="#EEFFA3">Your usual</text>
    <text x="236" y="256" text-anchor="middle" font-size="24" fill="#EEFFA3">74 to 82</text>
  </svg>
  <div class="st"><i></i>A little above your usual range</div>
  <p>FloraScore blends your last 3 days that have logs and compares you with you. It isn’t a medical score, and a lower number isn’t a diagnosis.</p>
</div>
<script>
/* Sarah today (C, 12 weeks, every meal): FloraScore 83, usual range 74 to 82, from L.score and L.scoreUsual */
var a=0.83*2*Math.PI,mk=document.getElementById('mk');mk.setAttribute('cx',(236+128*Math.sin(a)).toFixed(1));mk.setAttribute('cy',(168-128*Math.cos(a)).toFixed(1));
var B=document.body,R=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function count(){document.querySelectorAll('[data-n]').forEach(function(e){var n=+e.dataset.n,t0=performance.now();(function f(t){var k=Math.min(1,(t-t0)/1400);e.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
function play(){if(R)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go');count()}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
