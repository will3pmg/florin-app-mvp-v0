<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rings: FloraScore hero</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#F9F7F2}
.card{height:100%;border-radius:32px;padding:30px 32px;display:flex;flex-direction:column;gap:14px;background:radial-gradient(circle at 50% 40%,rgba(238,255,163,.09),rgba(238,255,163,0) 64%),#00352B}
.top{display:flex;justify-content:space-between;font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;text-transform:uppercase;color:#C7D0CA}
svg text{font-family:ui-monospace,Menlo,Consolas,monospace}
.st{display:flex;align-items:center;gap:16px;font:400 30px/1.2 Georgia,"Times New Roman",serif}
.st i{width:18px;height:18px;border-radius:50%;background:#DFC678;flex:none}
p{margin:0;font-size:24px;line-height:1.3;color:#C7D0CA}
.go .ring{animation:sweep 1.4s cubic-bezier(.3,.7,.2,1) both}
.go .band{animation:band .7s 1.1s ease-out both}
.go .mk{animation:pop .45s 1.35s cubic-bezier(.3,1.5,.5,1) both}
.go .st,.go p{animation:rise .6s 1.5s ease-out both}
.mk{transform-box:fill-box;transform-origin:center}
@keyframes sweep{from{stroke-dasharray:0 100}}
@keyframes band{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Rings look: FloraScore 83 today on a Ray ring, a little above its usual range of 74 to 82, which is drawn on the ring's outer track">
  <div class="top"><span>FloraScore</span><span>Sunday, October 11</span></div>
  <svg id="ch" viewBox="0 0 472 296" width="100%" height="296" style="flex:none" aria-hidden="true">
    <circle cx="236" cy="148" r="142" fill="none" stroke="#1B4A41" stroke-width="2"/>
    <circle cx="236" cy="148" r="118" fill="none" stroke="#1B4A41" stroke-width="18"/>
    <circle class="band" cx="236" cy="148" r="142" fill="none" stroke="#8AAA71" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="8 92" stroke-dashoffset="-74" transform="rotate(-90 236 148)"/>
    <circle class="ring" cx="236" cy="148" r="118" fill="none" stroke="#EEFFA3" stroke-width="18" stroke-linecap="round" pathLength="100" stroke-dasharray="83 100" transform="rotate(-90 236 148)"/>
    <circle id="mk" class="mk" r="10" fill="#DFC678" stroke="#00352B" stroke-width="4"/>
    <text x="236" y="96" text-anchor="middle" font-size="24" fill="#C7D0CA" letter-spacing="2">TODAY</text>
    <text x="236" y="170" text-anchor="middle" font-size="84" font-weight="300" fill="#F9F7F2" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">83</text>
    <text x="236" y="202" text-anchor="middle" font-size="24" fill="#EEFFA3">Your usual</text>
    <text x="236" y="228" text-anchor="middle" font-size="24" fill="#EEFFA3">74 to 82</text>
  </svg>
  <div class="st"><i></i>A little above its usual range</div>
  <p>FloraScore blends the days among your last 3 that have a BM, or No BM, logged, and compares you with you. It isn’t a medical score, and a lower number isn’t a diagnosis.</p>
</div>
<script>
/* Sarah today (C, 12 weeks, every meal): FloraScore 83, usual range 74 to 82, from L.score and L.scoreUsual. The
   bezel ticks, the range's end ticks and the end mark sit where the library's Rings card puts them */
var ch=document.getElementById('ch'),ns='http://www.w3.org/2000/svg',cx=236,cy=148;
function el(t,a){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);ch.insertBefore(e,ch.firstChild);return e}
function pt(f,r){var a=f*2*Math.PI;return[(cx+r*Math.sin(a)).toFixed(1),(cy-r*Math.cos(a)).toFixed(1)]}
[0,.25,.5,.75].forEach(function(f){var p=pt(f,94),q=pt(f,101);el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#55776F','stroke-width':2})});
[.74,.82].forEach(function(f){var p=pt(f,132),q=pt(f,150),e=el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#DBE9A2','stroke-width':2,'class':'band'});ch.appendChild(e)});
var m=pt(.83,118),mk=document.getElementById('mk');mk.setAttribute('cx',m[0]);mk.setAttribute('cy',m[1]);ch.appendChild(mk);
var B=document.body,R=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(R)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
