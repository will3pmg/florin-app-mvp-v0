<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Florin charts: FloraScore card</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#00352B}
.card{height:100%;background:#FFFFFD;border-radius:32px;padding:30px 32px;display:flex;flex-direction:column;gap:16px;box-shadow:inset 0 0 0 2px #E6E2D8}
.top{display:flex;align-items:flex-start;gap:18px}
.k{font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;color:#36544C;text-transform:uppercase}
h1{margin:4px 0 0;font:600 28px/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
p{margin:0;font-size:24px;line-height:1.35;color:#36544C}
p b{color:#00352B}
svg text{font:24px ui-monospace,Menlo,Consolas,monospace;fill:#5D766F}
.lg{display:flex;align-items:center;font-size:24px;color:#36544C}
.lg i{display:inline-block;width:28px;height:20px;border-radius:5px;background:#E6E1E3;box-shadow:inset 0 0 0 2px #C7BAC1;margin-right:10px}
.go .ln{animation:draw 1.6s .3s ease-out both}.go .ln+.ln{animation-delay:1.7s;animation-duration:.4s}
.go .bd{animation:fade .6s ease-out both}
.go .td{animation:pop .45s 2.1s cubic-bezier(.3,1.5,.5,1) both}
.go .tl{animation:fade .5s 2.3s ease-out both}
.td{transform-box:fill-box;transform-origin:center}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Florin charts, the FloraScore card: 83, a little above its usual range of 74 to 82, drawn as a line over the last 30 days on the usual band, with today ringed">
  <div class="top">
    <svg width="56" height="56" viewBox="0 0 56 56" style="flex:none" aria-hidden="true"><rect width="56" height="56" rx="16" fill="#F1EEE6"/><circle cx="28" cy="28" r="14" fill="none" stroke="#00352B" stroke-width="3"/></svg>
    <div><div class="k">FloraScore · Today</div><h1>83, a little above its usual range</h1></div>
  </div>
  <p>Your usual range is <b>74 to 82</b>. 3 points above last week, on average.</p>
  <svg id="ch" viewBox="0 0 472 252" width="100%" height="252" style="flex:none" aria-hidden="true"></svg>
  <div class="lg"><i></i>Your usual range, 74 to 82</div>
  <p>Timing moved it most this week, adding 3 points.</p>
</div>
<script>
/* Sarah (C, 12 weeks, every meal), FloraScore on each of the last 30 days, Sep 12 to Oct 11, from L.score in the
   model. null is Oct 8, a day with nothing logged, drawn as a gap. Usual range 74 to 82 (L.scoreUsual) */
var S=[82,79,82,82,86,83,83,80,84,84,70,70,71,85,82,80,78,79,77,81,79,82,82,85,86,83,null,78,83,83],U=[74,82];
var x=function(i){return 54+i*400/29},y=function(v){return 46+(91-v)*7.6};
var ch=document.getElementById('ch'),ns='http://www.w3.org/2000/svg';
function el(t,a,txt){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;ch.appendChild(e);return e}
function r1(v){return Math.round(v*10)/10}
/* the app's line: a monotone curve through each run of logged days */
function mono(P){var n=P.length,d=[],m=[],i;if(n<2)return'';for(i=0;i<n-1;i++)d[i]=(P[i+1][1]-P[i][1])/(P[i+1][0]-P[i][0]);
 m[0]=d[0];m[n-1]=d[n-2];for(i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
 for(i=0;i<n-1;i++){if(!d[i]){m[i]=m[i+1]=0;continue}var a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){var t=3/Math.sqrt(s);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}
 var o='M'+P[0];for(i=0;i<n-1;i++){var h=(P[i+1][0]-P[i][0])/3;o+='C'+r1(P[i][0]+h)+','+r1(P[i][1]+m[i]*h)+' '+r1(P[i+1][0]-h)+','+r1(P[i+1][1]-m[i+1]*h)+' '+P[i+1]}return o}
[70,80,90].forEach(function(v){el('line',{x1:48,x2:462,y1:y(v),y2:y(v),stroke:'#E8EDEA','stroke-width':1.5});el('text',{x:38,y:y(v)+8,'text-anchor':'end'},v)});
el('rect',{x:48,y:y(U[1]),width:414,height:y(U[0])-y(U[1]),fill:'#E6E1E3','class':'bd'});
[U[0],U[1]].forEach(function(v){el('line',{x1:48,x2:462,y1:y(v),y2:y(v),stroke:'#C7BAC1','stroke-width':1.5,'class':'bd'})});
var runs=[[]];S.forEach(function(v,i){if(v==null){runs.push([]);return}runs[runs.length-1].push([r1(x(i)),r1(y(v))])});
runs.forEach(function(P){if(P.length>1)el('path',{d:mono(P),fill:'none',stroke:'#00352B','stroke-width':3,'stroke-linecap':'round',pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':0,'class':'ln'})});
var tx=x(29),ty=y(83);
el('circle',{cx:tx,cy:ty,r:6,fill:'#00352B',stroke:'#FFFFFD','stroke-width':2.5,'class':'td'});
el('circle',{cx:tx,cy:ty,r:11,fill:'none',stroke:'#00352B','stroke-width':2.5,'class':'td'});
el('text',{x:468,y:62,'text-anchor':'end','class':'tl',style:'fill:#00352B;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif'},'Today 83');
el('text',{x:x(0)-4,y:246},'Sep 12');el('text',{x:x(14),y:246,'text-anchor':'middle'},'Sep 26');el('text',{x:468,y:246,'text-anchor':'end'},'Today');
var B=document.body,R=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(R)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
