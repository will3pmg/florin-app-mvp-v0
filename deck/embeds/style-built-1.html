<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Florin charts: Today's FloraScore card</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#F9F7F2}
.card{height:100%;background:#00352B;border-radius:32px;padding:36px 36px 32px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.nm{display:flex;align-items:center;gap:14px}
.k{font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1.5px;color:#EEFFA3;text-transform:uppercase}
.n{margin:4px 0 0;font-size:150px;line-height:.9;font-weight:300;letter-spacing:-6px}
.bar{position:relative;margin-top:8px}
.u{position:relative;height:30px;font:700 24px/30px ui-monospace,Menlo,Consolas,monospace;color:#EEFFA3}
.u span{position:absolute;left:57.5%;transform:translateX(-50%);white-space:nowrap}
.trk{position:relative;height:12px;margin-top:10px;border-radius:999px;background:#1F4F45}
.bd{position:absolute;left:47.5%;width:20%;top:-6px;bottom:-6px;border-radius:4px;background:#2B5A50;box-shadow:inset 0 0 0 2px #6F8F6A}
.dot{position:absolute;left:70%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#F9F7F2;box-shadow:0 0 0 4px #00352B}
.line{margin:10px 0 0;font:36px/1.25 Georgia,"Times New Roman",serif;color:#F9F7F2}
.sub{margin:0;font-size:24px;line-height:1.4;color:#D6DCD6}
.det{margin-top:auto;align-self:flex-end;display:flex;align-items:center;gap:8px;font-size:24px;font-weight:500;color:#EEFFA3}
.det svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.go .bd{animation:fade .6s .2s ease-out both}
.go .dot{animation:pop .45s .8s cubic-bezier(.3,1.5,.5,1) both}
.go .line,.go .sub{animation:rise .5s 1s ease-out both}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Florin charts, Today's FloraScore card: 83, a little above its usual range of 74 to 82, drawn as today's dot just past the usual range on a bar. Mild bloating at 3:10 PM; without it, FloraScore would be 84. Details opens FloraScore's page">
  <div class="top">
    <span class="nm"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="12.5" fill="none" stroke="#EEFFA3" stroke-width="3"/></svg><span class="k">FloraScore</span></span>
    <span class="k">Today</span>
  </div>
  <p class="n">83</p>
  <div class="bar">
    <p class="u" style="margin:0"><span>Your usual 74 to 82</span></p>
    <div class="trk"><i class="bd"></i><i class="dot"></i></div>
  </div>
  <p class="line">A little above its usual range.</p>
  <p class="sub">Mild bloating at 3:10 PM. Without it, FloraScore would be 84.</p>
  <span class="det">Details<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4l6 6-6 6"/></svg></span>
</div>
<script>
/* Sarah (C, 12 weeks, every meal), Today's FloraScore card on Oct 11, as RU.scoreHero draws it: L.score 83, its usual
   range 74 to 82 (L.scoreUsual) as a band on a bar from 55 to 95 (the band at 47.5% for 20%, today's dot at 70%, as
   the app places them), RU.scoreRel's words, and what the log that stood out did (RU.scoreEffect, scored without it) */
var B=document.body,Rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(Rm)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
