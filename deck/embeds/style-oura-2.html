<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Oura: Contributors</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#00352B}
.card{height:100%;background:#FFFFFD;border-radius:32px;padding:22px 28px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 2px #E6E2D8}
.top{display:flex;justify-content:space-between;font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#36544C}
.top b{font-weight:400;letter-spacing:1px}
.hl{margin:0;font:400 28px/1.2 Georgia,"Times New Roman",serif}
.say{margin:0;font-size:24px;line-height:1.3;color:#36544C}
.rows{display:flex;flex-direction:column;gap:10px;margin:4px 0 0}
.r1{display:flex;align-items:baseline;gap:12px}
.r1 .n{font-size:34px;font-weight:300;line-height:1;width:46px}
.r1 .nm{font-size:24px;flex:1}
.r1 .st{font-size:24px;color:#4F2641}
.r1 .st:after{content:"\203A";color:#36544C;margin-left:10px}
.r2{display:flex;align-items:center;gap:14px;height:30px}
.trk{position:relative;flex:1;height:4px;border-radius:2px;background:#E6EBE8}
.trk i{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:999px}
.trk .bd{transform:translateY(-50%);height:16px;background:#E6E1E3;box-shadow:inset 0 0 0 2px #4F2641}
.trk .lw{width:12px;height:12px;background:#FFFFFD;box-shadow:inset 0 0 0 2px #36544C}
.trk .m{width:18px;height:18px;background:#00352B;box-shadow:0 0 0 3px #FFFFFD}
.ch{width:222px;text-align:right;font-size:24px;color:#36544C;white-space:nowrap}
.lg{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:24px;color:#36544C;margin:4px 0 0}
.lg i{display:inline-block;margin-right:8px;vertical-align:-1px;border-radius:999px}
.go .m{animation:slide .8s cubic-bezier(.2,.8,.2,1) both}
.go .bd{animation:fade .5s ease-out both}
@keyframes slide{from{left:0;opacity:0}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Oura look, Contributors: Timing moved FloraScore most since last week, up 3 points. This week's FloraScore averages 83, against 80 last week. Timing 95, usual 81 to 97, up 3 points; How often 97, usual 90 to 97, the same as last week; Form 94, usual 85 to 98, down 1 point; Comfort 93, usual 83 to 97, up 1 point. Each part within its usual">
  <div class="top"><b>CONTRIBUTORS</b><span>This week</span></div>
  <p class="hl">Timing moved your FloraScore most since last week, up 3 points</p>
  <p class="say">This week’s FloraScore averages 83, against 80 last week.</p>
  <div class="rows" id="rows"></div>
  <div class="lg"><span><i style="width:16px;height:16px;background:#00352B;box-shadow:0 0 0 3px #C7D3CF"></i>This week</span><span><i style="width:12px;height:12px;box-shadow:inset 0 0 0 2px #36544C"></i>Last week</span><span><i style="width:26px;height:16px;background:#E6E1E3;box-shadow:inset 0 0 0 2px #4F2641"></i>That part’s usual</span></div>
</div>
<script>
/* Sarah this week (C, 12 weeks, every meal), each part of FloraScore out of 100 (L.scoreMoved): this week, last week,
   that part's usual, and the change in whole FloraScore points. The tracks run from 70 to 100, as in the library */
var P=[['Timing',95,88,81,97,'+3 pts'],['How often',97,97,90,97,'Same as last week'],['Form',94,98,85,98,'−1 pt'],['Comfort',93,88,83,97,'+1 pt']],h='';
var pc=function(v){return((v-70)/30*100).toFixed(1)+'%'};
P.forEach(function(p,i){h+='<div><div class="r1"><span class="n">'+p[1]+'</span><span class="nm">'+p[0]+'</span><span class="st">Within your usual</span></div>'+
 '<div class="r2"><span class="trk"><i class="bd" style="left:'+pc(p[3])+';width:'+((p[4]-p[3])/30*100).toFixed(1)+'%;animation-delay:'+(i*.12).toFixed(2)+'s"></i><i class="lw" style="left:'+pc(p[2])+'"></i><i class="m" style="left:'+pc(p[1])+';animation-delay:'+(.3+i*.12).toFixed(2)+'s"></i></span><span class="ch">'+p[5]+'</span></div></div>'});
document.getElementById('rows').innerHTML=h;
var B=document.body,R=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(R)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
