<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Oura: Contributors</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#F9F7F2}
p,ul{margin:0;padding:0;list-style:none}
.card{height:100%;border-radius:32px;padding:28px;display:flex;flex-direction:column;gap:8px;overflow:hidden;background-color:#052B23;
 background-image:radial-gradient(90% 60% at 0% 0%,rgba(59,109,123,.22),rgba(59,109,123,0) 70%),radial-gradient(70% 50% at 100% 0%,rgba(79,36,66,.3),rgba(79,36,66,0) 72%);box-shadow:inset 0 0 0 1px rgba(249,247,242,.07)}
.h{display:flex;justify-content:space-between;align-items:center;font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#CAD8D4}
.h .k{text-transform:uppercase;letter-spacing:.08em}
.h .d{letter-spacing:.04em}
.hl{font:400 28px/1.18 Georgia,"Times New Roman",serif;letter-spacing:-.005em;text-wrap:balance}
.cts{display:flex;flex-direction:column;gap:4px}
.ct{display:grid;grid-template-columns:72px 1fr;column-gap:12px;row-gap:2px;align-items:center}
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:24px;line-height:1.3}
.top .s{margin-left:auto;color:#FAFFBC}
.top svg{flex:none;width:22px;height:22px;fill:none;stroke:#CAD8D4;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.n{font-size:40px;line-height:1;font-weight:300;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.trk{position:relative;height:6px;border-radius:999px;background:rgba(247,247,239,.12)}
.trk i{position:absolute}
.bd{top:-6px;bottom:-6px;border-radius:999px;background:rgba(237,255,160,.17);box-shadow:inset 0 0 0 2px #FAFFBC}
.lw{top:50%;width:12px;height:12px;border-radius:50%;background:#052B23;box-shadow:inset 0 0 0 2px #CAD8D4;transform:translate(-50%,-50%)}
.m{top:50%;width:22px;height:22px;border-radius:50%;background:#F9F7F2;box-shadow:0 0 0 4px #052B23;transform:translate(-50%,-50%)}
.sc{display:flex;justify-content:space-between;padding-left:84px;margin-top:-4px;font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#8EA7A0}
.lg{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:24px;line-height:1.3;color:#CAD8D4}
.lg li{display:inline-flex;align-items:center;gap:10px}
.lg i{flex:none;display:inline-block;border-radius:50%}
.how{font-size:24px;line-height:1.3;color:#CAD8D4}
.go .card{animation:in .6s cubic-bezier(.2,.7,.1,1) both}
.go .bd,.go .lw{animation:fade .6s .2s cubic-bezier(.2,.7,.1,1) both}
.go .m{animation:mark .6s cubic-bezier(.2,.7,.1,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@keyframes fade{from{opacity:0}}
@keyframes mark{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Oura look, Contributors this week: Timing 95, How often 97, Form 94 and Comfort 93, each within that part’s usual, with last week marked on each track. Timing moved the FloraScore most since last week, up 3.0 points. Each part is out of 100">
  <div class="h"><span class="k">Contributors</span><span class="d">This week</span></div>
  <p class="hl">Timing moved your FloraScore most since last week, up 3.0 points</p>
  <ul class="cts" id="cts"></ul>
  <p class="sc" aria-hidden="true"><span>70</span><span>100</span></p>
  <ul class="lg">
    <li><i style="width:14px;height:14px;background:#F9F7F2;box-shadow:0 0 0 4px rgba(250,246,241,.22)"></i>This week</li>
    <li><i style="width:12px;height:12px;box-shadow:inset 0 0 0 2px #CAD8D4"></i>Last week</li>
    <li><i style="width:26px;height:16px;border-radius:999px;background:rgba(237,255,160,.17);box-shadow:inset 0 0 0 2px #FAFFBC"></i>That part’s usual</li>
  </ul>
  <p class="how">Each part is out of 100.</p>
</div>
<script>
/* Sarah this week (C, 12 weeks, every meal), from FLD.build, score.parts: this week, last week, that part's own usual.
   One scale for all four tracks, from 70 to 100, as look-oura sets it (a round ten under the lowest value shown) */
var P=[['Timing',95,88,81,97],['How often',97,97,90,97],['Form',94,98,85,98],['Comfort',93,88,83,97]],lo=70;
var at=function(v){return((v-lo)/(100-lo)*100).toFixed(1)+'%'},h='';
P.forEach(function(p,i){h+='<li class="ct"><p class="top"><span>'+p[0]+'</span><span class="s">Within your usual</span><svg viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5"/></svg></p>'+
 '<p class="n" data-n="'+p[1]+'">'+p[1]+'</p><span class="trk"><i class="bd" style="left:'+at(p[3])+';width:'+((p[4]-p[3])/(100-lo)*100).toFixed(1)+'%"></i><i class="lw" style="left:'+at(p[2])+'"></i><i class="m" style="left:'+at(p[1])+';animation-delay:'+(700+i*90)+'ms"></i></span></li>'});
document.getElementById('cts').innerHTML=h;
var B=document.body,Rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function count(){document.querySelectorAll('[data-n]').forEach(function(e){var n=+e.getAttribute('data-n'),t0=performance.now();e.textContent='0';(function f(t){var k=Math.min(1,(t-t0)/900);e.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
function play(){if(Rm)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go');count()}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
