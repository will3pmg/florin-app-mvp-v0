<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rings: Timing as a body clock</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#00352B}
.card{height:100%;background:#FFFEFB;border-radius:32px;padding:32px;display:flex;flex-direction:column;gap:16px;box-shadow:inset 0 0 0 2px #E6E2D8}
.k{font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;text-transform:uppercase;color:#3E5A52}
svg text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#3E5A52}
.st{font:400 28px/1.2 Georgia,"Times New Roman",serif}
.lg{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:24px;color:#3E5A52}
.lg i{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:8px}
.d{transform-box:fill-box;transform-origin:center}
.go .trk{animation:draw 1.2s ease-out both}
.go .sec{animation:fade .7s .5s ease-out both}
.go .d{animation:pop .35s cubic-bezier(.3,1.5,.5,1) both}
.go .st{animation:fade .6s 2.2s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.1)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Rings look: the morning as a curved clock from 6 to 10 AM, the usual window 7:15 to 8:45 AM as a band, 21 of 28 mornings inside it">
  <div class="k">Timing · First BM</div>
  <svg id="ch" viewBox="0 0 472 340" width="100%" height="340" style="flex:none" aria-hidden="true"></svg>
  <div class="st">Today 7:42 AM, inside your window.</div>
  <div class="lg"><span><i style="background:#00352B"></i>One morning, in your window</span><span><i style="background:#C2A64B"></i>Outside your window</span><span><i style="background:#ECE4E8;border:2px solid #8E6E82;border-radius:4px"></i>Your usual, 7:15 to 8:45 AM</span></div>
</div>
<script>
/* Sarah's first BM on the 28 mornings with one, Sep 12 to Oct 11 (C), in hours; the last is today. Window 7:15 to 8:45 AM */
var F=[8.017,7.384,7.628,8.162,7.754,8.914,7.577,6.998,7.919,7.669,7.911,7.999,7.155,7.348,7.556,9.08,7.83,9.33,8.08,9.17,7.75,7.67,7.58,7.83,8.92,7.5,7.67,7.7];
var lo=7.25,hi=8.75,cx=236,cy=214,R=150,ns='http://www.w3.org/2000/svg',ch=document.getElementById('ch');
function el(t,a,txt){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;ch.appendChild(e);return e}
var ang=function(h){return(-120+(h-6)/4*240)*Math.PI/180},pt=function(h,r){var a=ang(h);return[(cx+r*Math.sin(a)).toFixed(1),(cy-r*Math.cos(a)).toFixed(1)]};
function arc(h0,h1,r){var p=pt(h0,r),q=pt(h1,r);return'M'+p+'A'+r+','+r+' 0 '+((h1-h0)/4*240>180?1:0)+' 1 '+q}
el('path',{d:arc(6,10,R),fill:'none',stroke:'#E3E0D8','stroke-width':6,'stroke-linecap':'round',pathLength:1,'stroke-dasharray':1,'class':'trk'});
var a=pt(lo,R),b=pt(hi,R),c=pt(hi,90),d=pt(lo,90);
el('path',{d:'M'+a+'A'+R+','+R+' 0 0 1 '+b+'L'+c+'A90,90 0 0 0 '+d+'Z',fill:'#ECE4E8',stroke:'#C9B7C2','stroke-width':2,'class':'sec'});
el('path',{d:arc(lo,hi,R),fill:'none',stroke:'#8E6E82','stroke-width':8,'stroke-linecap':'round','class':'sec'});
el('circle',{cx:cx,cy:cy,r:84,fill:'#FFFEFB',stroke:'#E3E0D8','stroke-width':2});
[[6,'6 AM'],[7,'7'],[8,'8'],[9,'9'],[10,'10 AM']].forEach(function(t){var p=pt(t[0],R+18),q=pt(t[0],R+6),s=pt(t[0],R+40),e=t[0]===6||t[0]===10;if(e){s=[p[0],330]}el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#8A9A94','stroke-width':2});
 el('text',{x:s[0],y:e?s[1]:+s[1]+(t[0]===8?0:8),'text-anchor':e||t[0]===8?'middle':t[0]<8?'end':'start','font-size':24},t[1])});
/* five-minute bins, stacked inward from the outer track */
var bins={},ord=F.map(function(h,i){return[h,i]}).sort(function(x,y){return x[0]-y[0]});
ord.forEach(function(o,j){var h=o[0],k=Math.floor(h*12),n=bins[k]=(bins[k]||0)+1,m=Math.round(h*60)/60,inw=m>=lo&&m<=hi,p=pt((k+.5)/12,R-14-(n-1)*14),t=o[1]===F.length-1;
 el('circle',{cx:p[0],cy:p[1],r:t?7:6,fill:t?'#FFFEFB':inw?'#00352B':'#C2A64B',stroke:t?'#00352B':'none','stroke-width':t?3:0,'class':'d',style:'animation-delay:'+(.7+j*.05).toFixed(2)+'s'})});
el('text',{x:cx,y:cy+16,'text-anchor':'middle','font-size':88,style:'fill:#00352B;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-weight:300','data-n':21},'21');
el('text',{x:cx,y:cy+50,'text-anchor':'middle','font-size':24},'OF 28 MORNINGS');
el('text',{x:cx,y:cy+78,'text-anchor':'middle','font-size':24},'IN YOUR WINDOW');
var B=document.body,Rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function count(){document.querySelectorAll('[data-n]').forEach(function(e){var n=+e.getAttribute('data-n'),t0=performance.now();(function f(t){var k=Math.min(1,(t-t0)/1600);e.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
function play(){if(Rm)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go');count()}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
