<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Rings: Timing as a body clock</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#00352B}
.card{height:100%;background:#FFFFFD;border-radius:32px;padding:30px 32px;display:flex;flex-direction:column;gap:12px;box-shadow:inset 0 0 0 2px #E6E2D8}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.k{font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;text-transform:uppercase;color:#36544C;white-space:nowrap}
.chip{font-size:24px;font-weight:500;line-height:1;padding:8px 14px;border-radius:999px;background:#ECE7E8;color:#4F2641;white-space:nowrap}
svg text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#5D766F}
.st{font:400 28px/1.25 Georgia,"Times New Roman",serif}
.lg{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:24px;color:#36544C}
.lg i{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:10px;vertical-align:-1px}
.d{transform-box:fill-box;transform-origin:center}
.go .trk{animation:draw 1.2s ease-out both}
.go .sec{animation:fade .7s .5s ease-out both}
.go .d{animation:pop .35s cubic-bezier(.3,1.5,.5,1) both}
.go .now,.go .st{animation:fade .6s 2.2s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.1)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Rings look: the morning as a curved clock from 6 to 10 AM, the usual window 7:15 to 8:45 AM as a wedge, 21 of 28 mornings inside it, today 7:42 AM inside the window">
  <div class="top"><span class="k">Timing · First BM</span><span class="chip">7:15 to 8:45 AM</span></div>
  <svg id="ch" viewBox="0 0 472 352" width="100%" height="352" style="flex:none" aria-hidden="true"></svg>
  <div class="st">Today 7:42 AM, inside your window.</div>
  <div class="lg"><span><i style="background:#00352B"></i>One morning, in your window</span><span><i style="background:#C2A64B"></i>Outside your window</span><span><i style="background:#00352B;box-shadow:0 0 0 4px #DBE3E0,0 0 0 5px #73908A"></i>Today</span></div>
</div>
<script>
/* Sarah's first BM on the 28 mornings with one, Sep 12 to Oct 11 in date order (C), in hours; the last is today.
   Window 7:15 to 8:45 AM. As the library's Rings card draws it: 15-minute bins around a 6 to 10 AM clock, each
   morning stacked outward from the inner axis in date order */
var F=[8.017,7.384,7.628,8.162,7.754,8.914,7.577,6.998,7.919,7.669,7.911,7.999,7.155,7.348,7.556,9.08,7.83,9.33,8.08,9.17,7.75,7.67,7.58,7.83,8.92,7.5,7.67,7.7];
var lo=7.25,hi=8.75,cx=236,cy=206,R=160,IN=56,ns='http://www.w3.org/2000/svg',ch=document.getElementById('ch');
function el(t,a,txt){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;ch.appendChild(e);return e}
var ang=function(h){return(h-8)*60*Math.PI/180},pt=function(h,r){var a=ang(h);return[(cx+r*Math.sin(a)).toFixed(1),(cy-r*Math.cos(a)).toFixed(1)]};
function arc(h0,h1,r){return'M'+pt(h0,r)+'A'+r+','+r+' 0 '+((h1-h0)*60>180?1:0)+' 1 '+pt(h1,r)}
el('path',{d:arc(6,10,R),fill:'none',stroke:'#E8EDEA','stroke-width':4,'stroke-linecap':'round',pathLength:1,'stroke-dasharray':1,'class':'trk'});
el('path',{d:arc(lo,hi,R)+'L'+pt(hi,IN)+'A'+IN+','+IN+' 0 0 0 '+pt(lo,IN)+'Z',fill:'#EBE7E8','class':'sec'});
[lo,hi].forEach(function(h){var p=pt(h,IN),q=pt(h,R);el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#C7BAC1','stroke-width':2,'class':'sec'})});
el('path',{d:arc(lo,hi,R),fill:'none',stroke:'#B09DA8','stroke-width':8,'stroke-linecap':'round','class':'sec'});
el('path',{d:arc(6,10,IN),fill:'none',stroke:'#E0E7E4','stroke-width':2});
[[6,'6 AM','end'],[7,'7','end'],[8,'8','middle'],[9,'9','start'],[10,'10 AM','start']].forEach(function(t){var p=pt(t[0],R+5),q=pt(t[0],R+12),s=pt(t[0],R+24);el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#5D766F','stroke-width':2});
 el('text',{x:t[0]===8?s[0]:+s[0]+(t[2]==='end'?-4:4),y:t[0]===8?+s[1]-4:+s[1]+(t[0]===6||t[0]===10?22:8),'text-anchor':t[2],'font-size':24},t[1])});
var bins={};
F.forEach(function(h,i){var k=Math.floor((h-6)*4),n=bins[k]=(bins[k]||0)+1,m=Math.round(h*60)/60,inw=m>=lo&&m<=hi,p=pt(6+(k+.5)/4,IN+12+(n-1)*9.5),t=i===F.length-1;
 if(t){el('circle',{cx:p[0],cy:p[1],r:9,fill:'#DBE3E0',stroke:'#73908A','stroke-width':2,'class':'now'});el('text',{x:+p[0]-14,y:+p[1]-22,'text-anchor':'end','font-size':24,'class':'now',style:'fill:#00352B;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif'},'Today')}
 el('circle',{cx:p[0],cy:p[1],r:4.5,fill:inw?'#00352B':'#C2A64B',stroke:'#FFFFFD','stroke-width':1.5,'class':'d',style:'animation-delay:'+(.7+i*.05).toFixed(2)+'s'})});
el('text',{x:cx,y:cy+8,'text-anchor':'middle','font-size':76,style:'fill:#00352B;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-weight:300'},'21');
el('text',{x:cx,y:cy+50,'text-anchor':'middle','font-size':24,style:'fill:#36544C'},'OF 28 MORNINGS');
el('text',{x:cx,y:cy+78,'text-anchor':'middle','font-size':24,style:'fill:#36544C'},'IN YOUR WINDOW');
el('text',{x:cx,y:346,'text-anchor':'middle','font-size':24,style:'fill:#4F2641'},'Your usual 7:15 to 8:45 AM');
var B=document.body,Rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(Rm)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
