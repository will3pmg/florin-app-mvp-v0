<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Easy read: FloraScore</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#00352B}
.card{height:100%;background:#FFFFFD;border-radius:32px;padding:28px 32px;display:flex;flex-direction:column;gap:16px;box-shadow:inset 0 0 0 2px #E6E2D8}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top b{font-size:32px;font-weight:500}.top span{font-size:24px;color:#36544C}
.big{margin:40px 0 0;font-size:168px;line-height:1;font-weight:400;letter-spacing:-4px;font-variant-numeric:tabular-nums}
.ans{margin:0;font-size:40px;line-height:1.2;font-weight:400}
.sp{flex:1}
.how{margin:0;font:400 24px/1.3 Georgia,"Times New Roman",serif;color:#36544C}
.go .big{animation:rise .7s .2s cubic-bezier(.2,.8,.2,1) both}
.go .ans{animation:fade .6s .8s ease-out both}
.go .how{animation:fade .6s 1.2s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Easy read look: FloraScore 83 as a big number, then its words: a little above its usual range, 74 to 82">
  <div class="top"><b>FloraScore</b><span>Sunday, October 11</span></div>
  <p class="big">83</p>
  <p class="ans">A little above its usual range, 74 to 82.</p>
  <div class="sp"></div>
  <p class="how">FloraScore compares you with you. It isn’t a medical score, and a lower number isn’t a diagnosis.</p>
</div>
<script>
/* Sarah today (C, 12 weeks, every meal): FloraScore 83, usual range 74 to 82, "A little above its usual range"
   (L.score, L.scoreUsual, FLD's relation), drawn as the library's Easy read card and the Easy version's Today draw it:
   the number big, then its words. No ring filling toward 100, and the number never counts up */
var B=document.body,R=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(R)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
