<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Easy read: FloraScore</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#00352B}
p{margin:0}
.card{height:100%;background:#FFFFFD;border-radius:32px;padding:28px;display:flex;flex-direction:column;gap:24px;box-shadow:inset 0 0 0 2px #E6E2D8}
.h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px}
.t{font-size:32px;line-height:1.2;font-weight:500}
.side{font-size:26px;line-height:1.3;color:#36544C}
.ring{position:relative;width:272px;height:272px;margin:0 auto;flex:none}
.ring svg{display:block;width:100%;height:100%;overflow:visible}
.trk{fill:none;stroke:rgba(0,55,44,.09)}
.utrk{fill:none;stroke:rgba(0,55,44,.09);stroke-width:2}
.ub{fill:none;stroke:#4F2641;stroke-width:10;stroke-linecap:round}
.ue{stroke:#4F2641;stroke-width:3;stroke-linecap:round}
.arc{fill:none;stroke:#00352B;stroke-linecap:round}
.end{fill:#C2A64B;stroke:#FFFFFD;stroke-width:4}
.edge{fill:none;stroke:#695612;stroke-width:2}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.n{font-size:88px;line-height:1;font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.u{font-size:24px;line-height:1.25;font-weight:500;color:#4F2641}
.ans{font-size:34px;line-height:1.25}
.dot{display:inline-block;vertical-align:.06em;width:22px;height:22px;margin-right:16px;border-radius:50%;background:#C2A64B;box-shadow:inset 0 0 0 2px #695612}
.note{font:24px/1.5 Georgia,"Times New Roman",serif;color:#36544C}
.go .card>*{animation:rise .45s cubic-bezier(.2,.7,.1,1) both}
.go .card>:nth-child(2){animation-delay:60ms}
.go .card>:nth-child(3){animation-delay:120ms}
.go .card>:nth-child(4){animation-delay:180ms}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Easy read look: FloraScore 83 today in one big ring, your usual 74 to 82 written inside it and drawn on its outer edge, and the plain sentence A little above your usual range">
  <div class="h"><p class="t">FloraScore</p><p class="side">Sunday, October 11</p></div>
  <div class="ring">
    <svg id="ch" viewBox="0 0 240 240" aria-hidden="true"></svg>
    <div class="c" aria-hidden="true"><b class="n">83</b><span class="u">Your usual<br>74 to 82</span></div>
  </div>
  <p class="ans"><i class="dot" aria-hidden="true"></i>A little above your usual range.</p>
  <p class="note">FloraScore compares you with you. It isn’t a medical score, and a lower number isn’t a diagnosis.</p>
</div>
<script>
/* Sarah today (C, 12 weeks, every meal), from FLD.build: FloraScore 83, usual range 74 to 82, "A little above your usual
   range". The ring is look-easy's own: one track, the score from 12 o'clock, the usual as a band with end ticks outside it */
var V=83,U=[74,82],C=120,R=90,SW=22,RU=114,ns='http://www.w3.org/2000/svg',ch=document.getElementById('ch');
var pol=function(r,f){return[(C+r*Math.sin(f*2*Math.PI)).toFixed(1),(C-r*Math.cos(f*2*Math.PI)).toFixed(1)]};
function arc(r,a,b){var p=pol(r,a),q=pol(r,b);return'M'+p+'A'+r+','+r+' 0 '+(b-a>.5?1:0)+' 1 '+q}
function el(t,a){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);ch.appendChild(e);return e}
el('circle',{cx:C,cy:C,r:R,'class':'trk','stroke-width':SW});
el('circle',{cx:C,cy:C,r:RU,'class':'utrk'});
el('path',{d:arc(RU,U[0]/100,U[1]/100),'class':'ub'});
U.forEach(function(u){var a=pol(RU-9,u/100),b=pol(RU+9,u/100);el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],'class':'ue'})});
el('path',{d:arc(R,0,V/100),'class':'arc','stroke-width':SW});
var e=pol(R,V/100);el('circle',{cx:e[0],cy:e[1],r:14,'class':'end'});el('circle',{cx:e[0],cy:e[1],r:11,'class':'edge'});
var B=document.body,Rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(Rm)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
