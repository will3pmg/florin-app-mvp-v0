<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>History as a calendar</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#F9F7F2}
.card{height:100%;border-radius:32px;background:#14443B;padding:32px;display:grid;grid-template-columns:560px 1fr;gap:36px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hd h1{margin:0;font:400 34px Georgia,"Times New Roman",serif}
.ar{display:flex;gap:12px}.ar span{width:44px;height:44px;border-radius:22px;border:2px solid #325C53;display:flex;align-items:center;justify-content:center;font-size:24px;color:#BFD3CC}
.g{display:grid;grid-template-columns:repeat(7,72px);gap:8px}
.w{font:24px ui-monospace,Menlo,Consolas,monospace;color:#BFD3CC;text-align:center;padding-bottom:4px}
.c{height:72px;border-radius:18px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:24px}
.c i{width:12px;height:12px;border-radius:50%}
.c em{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:#C8A9BC}
.u{background:rgba(238,255,163,.1)}.u i{background:#EEFFA3}
.s{background:rgba(238,255,163,.04);box-shadow:inset 0 0 0 2px #DCC374}.s i{background:#DCC374}
.n{box-shadow:inset 0 0 0 2px #4A7068;color:#BFD3CC}
.sel{box-shadow:0 0 0 3px #14443B,0 0 0 6px #F9F7F2}
.s.sel{box-shadow:inset 0 0 0 2px #DCC374,0 0 0 3px #14443B,0 0 0 6px #F9F7F2}
.lg{display:flex;gap:24px;margin-top:18px;font-size:24px;color:#BFD3CC;align-items:center}
.lg b{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;font-weight:400}
.pn{border-left:2px solid #325C53;padding-left:32px;display:flex;flex-direction:column;gap:14px}
.k{font:24px ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px;color:#BFD3CC;text-transform:uppercase}
.pn h2{margin:0;font:400 34px/1.2 Georgia,"Times New Roman",serif}
.chip{align-self:flex-start;font-size:24px;padding:6px 16px;border-radius:18px;background:rgba(220,195,116,.12);color:#DCC374}
.e{display:grid;grid-template-columns:118px 1fr;gap:6px 12px;font-size:24px;line-height:1.3}
.e span:nth-child(odd){color:#BFD3CC}
.add{margin-top:auto;align-self:flex-start;font-size:24px;padding:10px 22px;border-radius:24px;border:2px solid #EEFFA3;color:#EEFFA3}
.go .c{animation:pop .35s cubic-bezier(.3,1.4,.5,1) both}
.go .sel{animation:pop .35s cubic-bezier(.3,1.4,.5,1) both,ring .5s 2.2s ease-out both}
.go .pn{animation:slide .7s 2.5s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes ring{from{box-shadow:inset 0 0 0 2px #DCC374,0 0 0 3px #14443B,0 0 0 3px rgba(249,247,242,0)}}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="History as a month calendar: Sarah's September, 14 days within her usual, 15 shifted and 1 gap; Tuesday September 22 is tapped and its five entries show beside the month">
  <div>
    <div class="hd"><h1>September 2026</h1><div class="ar"><span>‹</span><span>›</span></div></div>
    <div class="g" id="g"></div>
    <div class="lg"><span><b style="background:#EEFFA3"></b>Usual</span><span><b style="background:#DCC374"></b>Shift</span><span><b style="box-shadow:inset 0 0 0 2px #4A7068;border-radius:4px"></b>Gap</span><span><b style="background:#C8A9BC;width:10px;height:10px"></b>Symptom</span></div>
  </div>
  <div class="pn">
    <div class="k">Tapped</div>
    <h2>Tuesday, Sep 22</h2>
    <div class="chip">No BM, fewer than your usual 1 to 2</div>
    <div class="e">
      <span>9:13 AM</span><span>Low energy, mild</span>
      <span>9:45 AM</span><span>Bloating, mild</span>
      <span>12:53 PM</span><span>Lunch: chicken salad</span>
      <span>6:36 PM</span><span>Dinner: pizza</span>
      <span>9:45 PM</span><span>No BM today</span>
    </div>
    <div class="add">Add to this day</div>
  </div>
</div>
<script>
/* Sarah's September from L.facts (C, 12 weeks, every meal): u within her usual, s shifted, n not logged; 1 marks a
   symptom logged that day. Sep 1 is a Tuesday */
var D='s0 s0 s0 s0 s1 n0 u0 s0 s0 u1 s1 u0 s0 u0 u0 u0 s1 u0 s0 u0 u0 s1 u0 u0 s0 u1 u1 s1 u1 s0'.split(' '),h='';
'MTWTFSS'.split('').forEach(function(w){h+='<div class="w">'+w+'</div>'});
h+='<div></div>';
D.forEach(function(d,i){h+='<div class="c '+d[0]+(i===21?' sel':'')+'" style="animation-delay:'+(.05+i*.04).toFixed(2)+'s"'+'>'+(i+1)+(d[0]!=='n'?'<i></i>':'')+(d[1]==='1'?'<em></em>':'')+'</div>'});
document.getElementById('g').innerHTML=h;
var B=document.body,R=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(R)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
