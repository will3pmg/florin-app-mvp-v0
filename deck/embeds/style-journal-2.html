<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Field journal: FloraScore over 30 days</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#00352B}
.card{height:100%;background:#FEFCF6;border-radius:32px;padding:24px 28px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 2px #E0E4DE}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;text-transform:uppercase}
.head{display:flex;justify-content:space-between;gap:10px;padding:0 0 8px;border-bottom:2px solid #00352B;white-space:nowrap}
.head b{font-weight:700}.head span{color:#36544C}
.lede{margin:0;font:400 28px/1.25 Georgia,"Times New Roman",serif}
.mk{text-decoration:underline;text-decoration-color:#846677;text-decoration-thickness:2px;text-underline-offset:5px}
svg text{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;fill:#36544C}
.cap{display:flex;gap:14px;padding:8px 0 0;border-top:2px solid #E0E4DE;font:24px/1.2 ui-monospace,Menlo,Consolas,monospace;color:#36544C}
.cap b{color:#00352B}
.d{transform-box:fill-box;transform-origin:center}
.go .ln{animation:draw 1.6s .3s ease-out both}.go .ln+.ln{animation-delay:1.7s;animation-duration:.3s}
.go .d{animation:pop .3s cubic-bezier(.3,1.5,.5,1) both}
.go .tag{animation:fade .5s 2.1s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.go *{animation:none!important}}
</style></head>
<body>
<div class="card" role="img" aria-label="Field journal look: FloraScore over the last 30 days sat in its usual range of 74 to 82 on 15 of 29 days, above it on 11 and below it on 3. Lowest 70 on Sep 22. Today 83">
  <div class="head mono"><b>FloraScore over time</b><span>Last 30 days</span></div>
  <p class="lede">Your FloraScore sat <span class="mk">in its usual range</span> on 15 of 29 days.</p>
  <svg id="ch" viewBox="0 0 472 336" width="100%" height="336" style="flex:none" aria-hidden="true"></svg>
  <div class="cap"><b>Fig. 3</b><span>FloraScore, last 30 days</span></div>
</div>
<script>
/* Sarah (C, 12 weeks, every meal), FloraScore on each day, Sep 12 to Oct 11 (L.score). null is Oct 8, nothing logged.
   In its usual range (74 to 82) on 15 of the 29 scored days, above on 11, below on 3; lowest 70 on Sep 22 */
var S=[82,79,82,82,86,83,83,80,84,84,70,70,71,85,82,80,78,79,77,81,79,82,82,85,86,83,null,78,83,83];
var x0=40,x=function(i){return x0+i*282/29},y=function(v){return 70+(91-v)*9};
var ch=document.getElementById('ch'),ns='http://www.w3.org/2000/svg';
function el(t,a,txt){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;ch.appendChild(e);return e}
[70,80,90].forEach(function(v){el('line',{x1:x0,x2:326,y1:y(v),y2:y(v),stroke:'#E7EAE4','stroke-width':1.5});el('text',{x:30,y:y(v)+8,'text-anchor':'end',style:'fill:#5D766F'},v)});
el('rect',{x:x0,y:y(82),width:286,height:y(74)-y(82),fill:'#E6DEDD'});
[82,74].forEach(function(v){el('line',{x1:x0,x2:472,y1:y(v),y2:y(v),stroke:'#C6B8BC','stroke-width':1.5})});
el('text',{x:x0,y:22,style:'fill:#4F2641'},'YOUR USUAL RANGE, 74 TO 82');
el('line',{x1:x0,x2:x0,y1:30,y2:y(82),stroke:'#4F2641','stroke-width':2});el('circle',{cx:x0,cy:y(82),r:3.5,fill:'#4F2641'});
el('text',{x:472,y:y(82)-10,'text-anchor':'end'},'ABOVE, 11');el('text',{x:472,y:y(74)+30,'text-anchor':'end'},'BELOW, 3');
for(var i=0;i<30;i++){var mj=(i-2)%7===0;el('line',{x1:x(i),x2:x(i),y1:300,y2:mj?310:305,stroke:'#E0E4DE','stroke-width':1.5})}
el('text',{x:x0-4,y:334,style:'fill:#5D766F'},'SEP 12');el('text',{x:x(14),y:334,'text-anchor':'middle',style:'fill:#5D766F'},'SEP 26');el('text',{x:x(29),y:334,'text-anchor':'middle',style:'fill:#00352B'},'TODAY');
var runs=[[]];S.forEach(function(v,i){if(v==null){runs.push([]);return}runs[runs.length-1].push(x(i).toFixed(1)+','+y(v))});
runs.forEach(function(r){el('path',{d:'M'+r.join('L'),fill:'none',stroke:'#8CA29B','stroke-width':2.5,'stroke-linejoin':'round',pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':0,'class':'ln'})});
S.forEach(function(v,i){if(v!=null)el('circle',{cx:x(i).toFixed(1),cy:y(v),r:4.5,fill:'#00352B','class':'d',style:'animation-delay:'+(.3+i*.05).toFixed(2)+'s'})});
el('text',{x:x(10)-6,y:290,style:'fill:#00352B;paint-order:stroke;stroke:#FEFCF6;stroke-width:6px'},'LOWEST, 70 ON SEP 22');
var tx=x(29),ty=y(83);
el('circle',{cx:tx,cy:ty,r:9,fill:'none',stroke:'#00352B','stroke-width':2.5,'class':'tag'});
el('text',{x:tx,y:56,'text-anchor':'middle',style:'fill:#00352B','class':'tag'},'TODAY, 83');
el('line',{x1:tx,x2:tx,y1:64,y2:ty-10,stroke:'#5D766F','stroke-width':1.5,'class':'tag'});
var B=document.body,R=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function play(){if(R)return;B.classList.remove('go');void B.offsetWidth;B.classList.add('go')}
var on=false;if('IntersectionObserver'in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting&&!on){on=true;play()}else if(!e.isIntersecting)on=false})},{threshold:.3}).observe(B)}else play();
</script>
</body></html>
