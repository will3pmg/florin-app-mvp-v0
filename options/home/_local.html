<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Week Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=Lora:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Florin Health, DESIGN.md v1.1. The six brand colours are the only literal colours; everything else derives from them.
   This page: two questions about the week on Today, what it shows (four weeks side by side) and where it sits (Today
   on a phone in three places), each drawn in the app's own tokens. The page's tokens are the prototype page's. */
:root {
  --forest: #00352B; --cream: #F9F7F2; --ray: #EEFFA3; --plum: #4F2641; --teal: #396E7C; --gold: #D1BD7E;
  --raydeep: oklch(from var(--ray) calc(l - .43) c h);
  --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --serif: "Lora", Georgia, "Times New Roman", serif;
  --mono: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg: oklch(from var(--cream) calc(l - .04) calc(c * 1.1) h);
  --panel: oklch(from var(--cream) calc(l + .024) calc(c * .3) h);
  --ink: var(--forest);
  --ink-2: oklch(from var(--forest) calc(l + .12) c h);
  --ink-3: oklch(from var(--forest) calc(l + .22) calc(c * .7) h); /* 4.5:1 or more on the page ground and the panels, as the prototype's page */
  --line: color-mix(in srgb, var(--forest) 14%, transparent);
  --line-2: color-mix(in srgb, var(--forest) 8%, transparent);
  --signal: var(--raydeep);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(from var(--forest) calc(l - .085) calc(c * .7) h);
    --panel: oklch(from var(--forest) calc(l - .02) calc(c * .85) h);
    --ink: var(--cream);
    --ink-2: oklch(from var(--cream) calc(l - .14) calc(c * 1.4) h);
    --ink-3: oklch(from var(--cream) calc(l - .32) calc(c * 1.2) h);
    --line: color-mix(in srgb, var(--cream) 16%, transparent);
    --line-2: color-mix(in srgb, var(--cream) 8%, transparent);
    --signal: var(--ray);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(from var(--forest) calc(l - .085) calc(c * .7) h);
  --panel: oklch(from var(--forest) calc(l - .02) calc(c * .85) h);
  --ink: var(--cream);
  --ink-2: oklch(from var(--cream) calc(l - .14) calc(c * 1.4) h);
  --ink-3: oklch(from var(--cream) calc(l - .32) calc(c * 1.2) h);
  --line: color-mix(in srgb, var(--cream) 16%, transparent);
  --line-2: color-mix(in srgb, var(--cream) 8%, transparent);
  --signal: var(--ray);
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--sans); -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<link rel="stylesheet" href="../../prototype/css/app.css">
<!-- the app's own components: the hero, the day mark (RU.dayMark, .ap-day), the week card's lines and the chart marks -->
<link rel="stylesheet" href="../../prototype/css/refresh.css">
<link rel="stylesheet" href="css/home-options.css">
<main id="ho" class="ho"><p>Loading the options…</p></main>
<script src="../../prototype/js/lib.js"></script>
<script src="../../prototype/js/claims-rules.js"></script>
<script src="../../prototype/js/data-app.js"></script>
<script src="../../prototype/js/app-charts.js"></script>
<script src="../../prototype/js/refresh-data.js"></script>
<script src="../../prototype/js/refresh-ui.js"></script>
<script src="../../prototype/js/refresh-insights.js"></script>
<!-- the data looks' one data object, so the page can check its count against theirs -->
<script src="../../library/js/looks-data.js"></script>
<script src="js/home-options.js"></script>
</body>
</html>
